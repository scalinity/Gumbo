# Gumbo.app — the native shell (SPEC §9 M2): notch presence, ⌃⌥ push-to-talk, VPIO audio,
# WKWebView dashboard window. Generated project + DerivedData are gitignored; regenerate with
# `xcodegen generate` from this directory.
name: Gumbo
options:
  bundleIdPrefix: ai.Gumbo
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  DynamicNotchKit:
    url: https://github.com/mrkai77/dynamicnotchkit.git
    exactVersion: 1.1.0 # pinned — proven on the macOS 27.0 beta (spike 2)
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Stable bundle id from day one — TCC grants (mic, Accessibility) attach to it.
    PRODUCT_BUNDLE_IDENTIFIER: ai.Gumbo.app
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    # Local self-signed cert, no Apple Developer account needed (this app never ships to the
    # App Store). A stable local identity + stable bundle id is what makes TCC grants (mic,
    # Accessibility, Reminders) survive rebuilds — an ad-hoc identity (`-`) does NOT: it
    # re-prompts every rebuild because the signature hash changes each build. One-time setup:
    # Keychain Access → Certificate Assistant → Create a Certificate… → name it exactly
    # "Gumbo Local Signing" → Identity Type: Self Signed Root → Certificate Type: Code Signing
    # → Create; then open the new cert's info, expand Trust, set "Code Signing" to Always
    # Trust. CODE_SIGN_STYLE Manual then signs straight from that keychain identity — no
    # portal/team lookup, no DEVELOPMENT_TEAM key needed.
    CODE_SIGN_STYLE: Manual
    CODE_SIGN_IDENTITY: "Gumbo Local Signing"
    ENABLE_HARDENED_RUNTIME: NO
targets:
  Gumbo:
    type: application
    platform: macOS
    sources:
      - path: Sources
    dependencies:
      - package: DynamicNotchKit
    info:
      path: Sources/Info.plist
      properties:
        CFBundleName: Gumbo
        CFBundleDisplayName: Gumbo
        LSMinimumSystemVersion: "26.0"
        LSUIElement: true # agent app — no Dock icon; presence is the notch + status item
        NSHighResolutionCapable: true
        NSMicrophoneUsageDescription: "Gumbo listens while you hold Control-Option to talk to it."
        # M5: EventKit mirror of Gumbo's reminders (shell owns ALL TCC; first create prompts).
        NSRemindersFullAccessUsageDescription: "Gumbo puts the reminders you set into Reminders.app so they fire even when Gumbo isn't running."
        # M6: osascript / shortcuts run from the shell so Automation TCC attributes to Gumbo.
        # Accessibility (AX control) is already granted and needs no usage string; this covers
        # the Apple-Events prompt macOS shows per target app the first time a script drives it.
        NSAppleEventsUsageDescription: "Gumbo runs the Mac actions you ask for by controlling apps on your behalf."
